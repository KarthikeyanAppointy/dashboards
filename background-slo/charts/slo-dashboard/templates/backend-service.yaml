apiVersion: v1
kind: Service
metadata:
  name: {{ include "slo-dashboard.backendServiceName" . }}
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "slo-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
