apiVersion: v1
kind: Service
metadata:
  name: {{ include "slo-dashboard.fullname" . }}
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "slo-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
