apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slo-dashboard.fullname" . }}-secret
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $dburl := .Values.secret.DATABASE_URL }}
  {{- if not $dburl }}
    {{- $dburl = printf "postgres://postgres:postgres@%s-postgresql:5432/slo_dashboard?sslmode=disable" .Release.Name }}
  {{- end }}
  DATABASE_URL: {{ $dburl | b64enc | quote }}
  {{- if .Values.secret.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_ID: {{ .Values.secret.AWS_ACCESS_KEY_ID | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.AWS_SECRET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secret.AWS_SECRET_ACCESS_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.AWS_SESSION_TOKEN }}
  AWS_SESSION_TOKEN: {{ .Values.secret.AWS_SESSION_TOKEN | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.ADMIN_KEY }}
  ADMIN_KEY: {{ .Values.secret.ADMIN_KEY | b64enc | quote }}
  {{- end }}
