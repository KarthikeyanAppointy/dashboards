{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "slo-dashboard.serviceAccountName" . }}
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
  {{- if or (len .Values.serviceAccount.annotations) .Values.serviceAccount.workloadIdentity.enabled }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceAccount.workloadIdentity.enabled }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.workloadIdentity.gcpServiceAccount }}
    {{- end }}
  {{- end }}
{{- end }}
