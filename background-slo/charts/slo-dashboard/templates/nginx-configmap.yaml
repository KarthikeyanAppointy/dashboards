apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slo-dashboard.fullname" . }}-nginx
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {
        worker_connections 1024;
    }
    http {
        access_log off;
        proxy_temp_path /tmp;
        client_body_temp_path /tmp;
        fastcgi_temp_path /tmp;
        uwsgi_temp_path /tmp;
        scgi_temp_path /tmp;
        server {
            listen 80;
            location / {
                proxy_pass http://{{ include "slo-dashboard.backendServiceName" . }}:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
