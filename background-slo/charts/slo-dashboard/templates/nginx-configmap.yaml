apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slo-dashboard.fullname" . }}-nginx
  labels:
    {{- include "slo-dashboard.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        access_log off;
        proxy_temp_path /tmp;
        client_body_temp_path /tmp;
        fastcgi_temp_path /tmp;
        uwsgi_temp_path /tmp;
        scgi_temp_path /tmp;
        server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;

            # Proxy API requests to the backend
            location /api/ {
                proxy_pass http://{{ include "slo-dashboard.backendServiceName" . }}:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Health check endpoint
            location /health {
                proxy_pass http://{{ include "slo-dashboard.backendServiceName" . }}:8080;
                proxy_set_header Host $host;
            }

            # Static files (js, css, images, fonts) with long-term caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # Everything else: serve index.html (SPA routing)
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
