# =============================================================================
# SLO Dashboard Helm Chart Values
# =============================================================================

# -- Number of replicas for the deployment
replicaCount: 1

# -- Override the base name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# -- Backend image configuration
backend:
  image:
    # -- Backend image repository (Go API)
    repository: technotech001/background-slo-backend
    tag: "v0.2.003"
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image pull secrets (empty for public images on Docker Hub)
    pullSecrets: []
  # -- Backend resource requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Frontend configuration
frontend:
  image:
    # -- Frontend image repository (Nginx serving static files)
    repository: technotech001/background-slo-frontend
    tag: "v0.2.003"
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image pull secrets (empty for public images on Docker Hub)
    pullSecrets: []
  # -- Frontend resource requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -- Istio configuration
istio:
  # -- Enable Istio Gateway and VirtualService
  enabled: false
  # -- Hosts for the Istio Gateway and VirtualService
  hosts:
    - "*"

# -- Ingress configuration (alternative to Istio, enabled by default)
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Ingress hostnames
  hosts:
    - host: slo-dashboard.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []
  #   - secretName: slo-dashboard-tls
  #     hosts:
  #       - slo-dashboard.local

# -- Environment variables passed to the container
# These will be set directly on the pod (not via ConfigMap) for sensitive data.
# See `configmap` for non-sensitive environment variables.
extraEnv: []
# - name: FOO
#   value: bar
# - name: SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: my-key

# -- ConfigMap values (non-sensitive environment variables)
configmap:
  # -- Application port
  PORT: "8080"
  # -- Path to frontend static files
  FRONTEND_DIR: "/app/frontend"
  # -- Default tenant name seeded on first run
  DEFAULT_TENANT_NAME: "Default"
  # -- Default domain ID for the seed tenant
  DEFAULT_DOMAIN_ID: "508e3ea6-3166-445c-b748-1434029cd205"
  # -- Default domain name for the seed tenant
  DEFAULT_DOMAIN_NAME: "qa-admin"
  # -- Default Elasticsearch endpoint
  # NOTE: When running inside Kubernetes, use the internal service name,
  # e.g. "http://elasticsearch-master.elasticsearch.svc.cluster.local:9200"
  DEFAULT_ES: "http://cadence-1-1-0-elasticsearch-master-hl:9200"
  # -- Default Elasticsearch index
  DEFAULT_INDEX: "cadence-visibility"
  # -- Google OAuth Client ID (used by backend to verify ID tokens)
  # -- make sure that docker image is built with the same VITE_GOOGLE_CLIENT_ID
  # -- AWS region for CloudWatch SES metrics queries
  AWS_REGION: "us-east-1, ap-southeast-2"
  # -- Comma-separated list of AWS regions for the SES region dropdown
  SES_REGIONS: "us-east-1, ap-southeast-2"
  # -- Optional SES configuration set name to filter metrics by
  SES_CONFIG_SET_NAME: ""
  # -- Display name shown in the SES dashboard header
  SES_DOMAIN_NAME: "ses"
  # -- Restrict login to @appointy.com accounts only (set to "false" to allow any Google account)
  APPONTY_ONLY_LOGIN: "true"

# -- Workflow history uploads for Codefac/alert {{workflow_history}} placeholders
# Prefer this block over legacy configmap.WORKFLOW_HISTORY_* keys.
# On GKE, enable serviceAccount.workloadIdentity and grant the GCP SA roles/storage.objectCreator on the bucket.
workflowHistory:
  # -- Storage mode: auto (upload when bucket set), gcs (always upload), inline (embed JSON)
  storage: auto
  # -- GCS bucket name for history JSON objects
  bucket: ""
  # -- Object path prefix inside the bucket (objects: {prefix}/{domain}/{date}/{workflow}_{run}_history.json)
  prefix: workflow-history
  # -- Mount a GCP service account JSON key for GCS uploads (alternative to Workload Identity)
  gcsCredentials:
    # -- Use an existing Kubernetes secret that contains the JSON key
    existingSecret: ""
    # -- Key name inside the secret (file mounted as key.json)
    secretKey: "gcs-service-account.json"
    # -- Directory where the key file is mounted in the backend container
    mountPath: "/var/secrets/gcs"

# -- Secret values (sensitive environment variables)
# These will be stored as a Kubernetes Secret and injected as env vars.
secret:
  # -- PostgreSQL connection string
  # If empty, defaults to: postgres://postgres:postgres@{{ .Release.Name }}-postgresql:5432/slo_dashboard?sslmode=disable
  DATABASE_URL: ""
  # -- AWS Access Key ID for CloudWatch SES metrics queries
  AWS_ACCESS_KEY_ID: ""
  # -- AWS Secret Access Key for CloudWatch SES metrics queries
  AWS_SECRET_ACCESS_KEY: ""
  # -- AWS Session Token (optional, for temporary credentials)
  # AWS_SESSION_TOKEN: ""
  # -- One-time admin setup key for RBAC bootstrap
  # Used by POST /api/rbac/setup-admin to create the initial admin user.
  ADMIN_KEY: ""
  # -- Optional GCP access token for GCS uploads (short-lived; prefer gcsServiceAccountJson or Workload Identity)
  GCS_ACCESS_TOKEN: ""
  # -- GCP service account JSON key contents (stored in release secret as gcs-service-account.json)
  # Prefer workflowHistory.gcsCredentials.existingSecret for production. Use: helm upgrade --set-file secret.gcsServiceAccountJson=./key.json
  gcsServiceAccountJson: ""

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  # -- Enable HPA
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: ""

# -- PodDisruptionBudget configuration
podDisruptionBudget:
  # -- Enable PDB
  enabled: false
  # -- Min available pods (mutually exclusive with maxUnavailable)
  minAvailable: ""
  # -- Max unavailable pods (mutually exclusive with minAvailable)
  maxUnavailable: ""

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity for pod assignment
affinity: {}

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  # -- Run as a non-root user (matches the Dockerfile's appuser with UID 1000)
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 5

# -- Service account configuration
serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account
  annotations: {}
  # -- The name of the service account to use
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Workload Identity configuration (GKE)
  workloadIdentity:
    # -- Enable GKE Workload Identity
    enabled: false
    # -- GCP service account email
    gcpServiceAccount: ""

# -- Priority class name for the pod
priorityClassName: ""

# -- Update strategy for the deployment
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# -- Additional volumes for the pod
extraVolumes: []
# - name: extra-volume
#   emptyDir: {}

# -- Additional volume mounts for the container
extraVolumeMounts: []
# - name: extra-volume
#   mountPath: /path/inside/container
